<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#07151c">
    <title>Верфь — нет связи</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #07151c; color: #ecf8f6; }
      main { width: min(30rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #17414d; border-radius: 1.5rem; background: #0d2832; box-shadow: 0 1.5rem 4rem #02090d99; }
      img { width: 4rem; height: 4rem; }
      h1 { margin: 1rem 0 .5rem; font-size: 1.6rem; }
      p { margin: 0; color: #a9c6c8; line-height: 1.6; }
      button { margin-top: 1.5rem; border: 0; border-radius: .8rem; padding: .8rem 1rem; background: #25d1b2; color: #041316; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/werft.svg" alt="">
      <h1>Верфь ждёт связь</h1>
      <p>Откройте уже загруженную вкладку или повторите попытку. Локальные данные остаются на устройстве.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
